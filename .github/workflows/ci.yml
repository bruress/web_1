name: PHP integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Initialize configuration
        run: make init
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start application stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Install and validate dependencies
        run: |
          docker compose exec -T -u www-data php composer install --no-interaction --prefer-dist
          docker compose exec -T -u www-data php composer validate --no-check-publish
          docker compose exec -T -u www-data php composer check-platform-reqs
      - name: Check PHP syntax
        run: docker compose exec -T php sh -c 'find . -path ./vendor -prune -o -name "*.php" -print0 | xargs -0 -n1 php -l'
      - name: Apply migrations
        run: |
          docker compose exec -T -u www-data php composer migrate
          docker compose exec -T -u www-data php composer migrate:status
      - name: Run PostgreSQL and HTTP integration tests
        run: docker compose exec -T -u www-data php composer test
      - name: Smoke test nginx and php-fpm
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/health.php
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q 'Тестовая запись из миграции Eloquent'
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' -d 'note=nginx-smoke' http://127.0.0.1:8080/)" = 303
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q 'nginx-smoke'
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
